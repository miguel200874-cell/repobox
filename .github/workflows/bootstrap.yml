name: Bootstrap Repo2Box

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish complete source tree
        run: |
          tar -xzf Repo2Box-bootstrap.tar.gz --strip-components=1
          rm -f Repo2Box-bootstrap.tar.gz .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initial Repo2Box v0.2.0 release"
          git push
